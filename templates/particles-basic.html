<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子背景 - 单效果模板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; }

  /* 你的页面内容放这里 */
  .page {
    position: relative;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* ⚠️ 关键：容器 div 必须显式撑满，否则 tsParticles 测到 0 高度不渲染 */
  #tsparticles {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
  }
  .page .content {
    position: relative; z-index: 2; text-align: center; pointer-events: none;
    padding: 2rem;
  }
  .page .content h1 { font-size: 2.5rem; margin-bottom: 1rem; }
  .page .content p  { opacity: 0.85; max-width: 480px; line-height: 1.6; }
</style>
</head>
<body>

<div class="page">
  <div id="tsparticles"></div>
  <div class="content">
    <h1>你的标题</h1>
    <p>你的正文内容。粒子在背景层，不影响阅读。</p>
  </div>
</div>

<!-- 本地依赖：把技能包 assets/ 下的两个文件放同目录 -->
<script src="tsparticles.engine.min.js"></script>
<script src="tsparticles.bundle.min.js"></script>

<script>
(async () => {
  // ⚠️ v4 必须：先注册功能
  await loadFull(tsParticles);

  await tsParticles.load({
    id: 'tsparticles',
    options: {
      fpsLimit: 60,
      detectRetina: true,
      pauseOnBlur: true,
      pauseOnOutsideViewport: true,
      fullScreen: { enable: false },
      particles: {
        number:  { value: 80, density: { enable: true }, limit: 150 },
        color:   { value: '#60a5fa' },
        shape:   { type: 'circle' },
        opacity: { value: 0.6, animation: { enable: true, speed: 1, min: 0.1 } },
        size:    { value: { min: 1, max: 4 }, animation: { enable: true, speed: 2 } },
        links:   { enable: true, distance: 150, color: '#60a5fa', opacity: 0.3, width: 1 },
        move:    { enable: true, speed: 1.5, direction: 'none', random: true, outModes: 'bounce' }
      },
      interactivity: {
        detectsOn: 'canvas',
        events: {
          onHover: { enable: true, mode: 'repulse' },
          onClick: { enable: true, mode: 'push' }
        },
        modes: {
          repulse: { distance: 120, duration: 0.4 },
          push:    { quantity: 4 }
        }
      }
    }
  });
})();
</script>
</body>
</html>
